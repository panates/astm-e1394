extends: '@panates/rman-preset'

# Install, sync the lockfile and publish with pnpm.
packageManager:
  node: pnpm

# Each group directory names its version group in its own .rmanrc.yml. The packages of one
# group release together; the groups release independently.
version:
  # Bump every package in the group, not only the ones that changed.
  cascade: group
  # Releases are betas (1.0.0-beta.N) until this line and publish.npm.latestPrereleases are
  # removed for 1.0.0.
  preid: beta

publish:
  npm:
    # With no stable release yet, each beta is published to "latest" instead of "beta": npm search
    # and a plain install show the newest one.
    latestPrereleases: [beta]

changelog:
  # One changelog per group.
  groupBy: group
